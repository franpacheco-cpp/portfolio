<form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
  <div class="input-group">
    <input type="email" placeholder="Correo electrónico" formControlName="email" />
  </div>

  <div class="input-group">
    <input type="password" placeholder="Contraseña" formControlName="contrasenia" />
  </div>

  <div class="input-group">
    <input type="password" placeholder="Repetir contraseña" formControlName="contrasenia2" />
  </div>

  <button type="submit">Registrarse</button>
</form>
